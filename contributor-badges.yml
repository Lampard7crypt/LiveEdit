name: Contributor badges

# Posts a thank-you comment with badges when a pull request is merged.
#
# SECURITY: this uses pull_request_target so it can comment on PRs from forks.
# That is safe ONLY because the job never checks out or runs code from the PR.
# Do not add a checkout of the PR head, or run any script from the PR, to this file.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  award:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Post badges
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const login = pr.user.login;
            const branch = context.payload.repository.default_branch;
            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/.github/badges`;
            const MARKER = '<!-- liveedit-badge-comment -->';

            // Maintainers add one of these labels to a PR before merging.
            const LABEL_BADGES = {
              'badge:test':   { file: 'test-hero',       title: 'Test Hero' },
              'badge:bug':    { file: 'bug-squasher',    title: 'Bug Squasher' },
              'badge:docs':   { file: 'docs-champion',   title: 'Docs Champion' },
              'badge:design': { file: 'pixel-perfect',   title: 'Pixel Perfect' },
              'badge:audio':  { file: 'audio-alchemist', title: 'Audio Alchemist' },
            };

            // Don't hand badges to the maintainer's own PRs.
            if (pr.author_association === 'OWNER') {
              core.info('PR by repository owner, skipping.');
              return;
            }

            // Don't comment twice if the event somehow fires again.
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            if (existing.some(c => c.body && c.body.includes(MARKER))) {
              core.info('Badge comment already exists, skipping.');
              return;
            }

            // Is this their first merged PR here? Search can lag a moment behind the merge,
            // so a count of 0 or 1 both mean "this one is the first".
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:merged author:${login}`,
              per_page: 1,
            });
            const mergedCount = search.data.total_count;

            const badges = [];
            if (mergedCount <= 1) {
              badges.push({ file: 'first-pr', title: 'First PR Merged' });
            }
            for (const label of pr.labels) {
              const b = LABEL_BADGES[label.name.toLowerCase()];
              if (b && !badges.some(x => x.file === b.file)) badges.push(b);
            }
            // Everyone who gets a PR merged gets the participation badge.
            badges.push({ file: 'contributor', title: 'Hacktoberfest' });

            const lines = [];
            lines.push(MARKER);
            lines.push(`## Merged! Thank you, @${login}`);
            lines.push('');
            lines.push('Your contribution is now part of LiveEdit. Here ' +
              (badges.length > 1 ? 'are your badges:' : 'is your badge:'));
            lines.push('');
            for (const b of badges) {
              lines.push(`<img src="${rawBase}/${b.file}.svg" alt="${b.title}" width="300">`);
              lines.push('');
            }
            lines.push('<details><summary>Show it off on your GitHub profile</summary>');
            lines.push('');
            lines.push('Paste this into your profile README:');
            lines.push('');
            lines.push('```html');
            for (const b of badges) {
              lines.push(`<img src="${rawBase}/${b.file}.svg" alt="${b.title}" width="240">`);
            }
            lines.push('```');
            lines.push('');
            lines.push('</details>');
            lines.push('');
            lines.push('Want more? See the full list in [CONTRIBUTORS.md](' +
              `https://github.com/${owner}/${repo}/blob/${branch}/CONTRIBUTORS.md).`);

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body: lines.join('\n'),
            });
